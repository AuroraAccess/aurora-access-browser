<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #202124;
      color: #e8eaed;
      font-size: 13px;
    }
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #3c4043;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      background: #303134;
      border: 1px solid #5f6368;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
    }
    button:hover { background-color: #1557b7; }
    button:disabled { background-color: #3c4043; color: #80868b; cursor: not-allowed; }
    .btn-secondary {
      background: none;
      border: 1px solid #5f6368;
      color: #9aa0a6;
      padding: 5px 12px;
    }
    .btn-secondary:hover { border-color: #8ab4f8; color: #8ab4f8; background: none; }
    .btn-secondary:disabled { border-color: #3c4043; color: #5f6368; }

    /* ── Фильтр типов ресурсов ── */
    .types-row { flex-wrap: wrap; row-gap: 6px; }
    .types-title {
      font-size: 11px;
      color: #9aa0a6;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-right: 4px;
      user-select: none;
    }
    label.type-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border: 1px solid #5f6368;
      border-radius: 999px;
      font-size: 12px;
      color: #e8eaed;
      cursor: pointer;
      user-select: none;
      transition: border-color .1s ease, background-color .1s ease;
    }
    label.type-chip:hover { border-color: #8ab4f8; }
    label.type-chip input { accent-color: #1a73e8; margin: 0; }

    .status-container { margin-top: 8px; }
    .progress-bar-bg {
      width: 100%;
      background-color: #303134;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
      display: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #34a853;
      transition: width 0.1s ease;
    }
    /* Фаза генерации архива — жёлтый, чтобы визуально отличать от упаковки файлов. */
    .progress-bar-fill.compressing { background-color: #fbbc04; }

    #status-text { color: #9aa0a6; font-size: 11px; }
    #status-text.error { color: #f28b82; }
    #status-text.done { color: #81c995; }

    .stats { font-size: 11px; color: #8ab4f8; }
    .stats-detail { font-size: 11px; color: #9aa0a6; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="row">
      <input type="text" id="path-filter" placeholder="Фильтр по пути (например: dist/vite или .*\.js$)">
      <button id="btn-download">Скачать все в .ZIP</button>
      <button id="btn-clear" class="btn-secondary" title="Сбросить список перехваченных ресурсов">Сброс</button>
    </div>
    <div class="row types-row">
      <span class="types-title" title="Какие MIME-типы попадут в архив">Типы:</span>
      <label class="type-chip"><input type="checkbox" class="type-filter" value="scripts" checked>Скрипты</label>
      <label class="type-chip"><input type="checkbox" class="type-filter" value="images" checked>Картинки</label>
      <label class="type-chip"><input type="checkbox" class="type-filter" value="fonts" checked>Шрифты</label>
      <label class="type-chip"><input type="checkbox" class="type-filter" value="styles" checked>Стили</label>
      <label class="type-chip"><input type="checkbox" class="type-filter" value="other" checked>Прочее</label>
    </div>
    <div class="row">
      <span class="types-title" title="Опции сборки архива">Опции:</span>
      <label class="type-chip" title="STORE вместо DEFLATE: ускоряет сборку уже сжатых типов (png, woff2, mp4)"><input type="checkbox" id="opt-no-compress">Без сжатия</label>
    </div>
    <div class="stats">Перехвачено файлов в текущей сессии: <span id="file-count">0</span></div>
    <div class="stats-detail"><span id="match-count"></span></div>
  </div>

  <div class="status-container">
    <div id="status-text">Ожидание действий...</div>
    <div class="progress-bar-bg" id="progress-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- JSZip вынесен в vendor-файл: инлайн-вставка минифицированного кода хрупкая и
       затрудняет обновление библиотеки. MV3 CSP запрещает remote-скрипты,
       поэтому библиотека лежит локально в бандле расширения. -->
  <script src="vendor/jszip.min.js"></script>
  <script src="panel.js"></script>
</body>
</html>
