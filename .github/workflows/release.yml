name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write

    strategy:
      # A failing platform must not cancel the others: a release is only useful
      # once every platform has attached its artifacts.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm install --include=optional
            npm install @rollup/rollup-win32-x64-msvc
          else
            npm install --include=optional
          fi

      - name: Build and Publish
        run: npm run electron:deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder uploads into a DRAFT release, because this repository uses
  # immutable releases: once a release is published its assets and tag are
  # frozen, so platforms that finished later could never attach their files.
  # This job flips the draft to published only after every platform succeeded.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
