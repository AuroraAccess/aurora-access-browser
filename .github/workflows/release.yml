name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ensure a draft release exists
        run: |
          if release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            if [ "$release_state" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is not a draft." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write

    strategy:
      # A failing platform must not cancel the others: a release is only useful
      # once every platform has attached its artifacts.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm install --include=optional
            npm install @rollup/rollup-win32-x64-msvc
          else
            npm install --include=optional
          fi

      - name: Build and Publish
        run: npm run electron:deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish only after every platform has attached its artifacts to the draft.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
